# Прогоняет линтер и тесты на каждый пуш и на каждый pull request.
# Деплой на Pages живёт отдельно (deploy.yml) и этих проверок не ждёт.
name: Тесты и линтер

on:
  push:
  pull_request:

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет ещё идущую проверку: нужен свежий результат.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 — нижняя граница из engines в package.json, 24 — текущая LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci ставит ровно то, что записано в package-lock.json.
      - name: Установить зависимости линтера
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test
